name: Bahmni Auto PR Bot
on:
  repository_dispatch:
    types: [ready-for-dev, bot-approved]
  # schedule:
  #   - cron: '*/15 * * * *'   # fallback safety net
  # schedule:
  #   - cron: '30 3 * * 1-5'   # 9:00am IST (UTC+5:30), Mon–Fri
  workflow_dispatch:
    inputs:
      jira_id:
        description: 'Jira Issue Key (e.g. BAH-123)'
        required: true
        type: string

# Serialize runs that target the SAME card so two triggers (ready-for-dev /
# bot-approved / manual) can't create duplicate branches or PRs. Runs for
# DIFFERENT cards remain in different groups and still run in parallel.
concurrency:
  group: bahmni-bot-${{ github.event.client_payload.issueKey || github.event.inputs.jira_id || 'full-scan' }}
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Build trigger message
        id: msg
        env:
          # repository_dispatch payload (empty on manual/scheduled runs)
          DISPATCH_ISSUE: ${{ github.event.client_payload.issueKey }}
          DISPATCH_EVENT: ${{ github.event.client_payload.event }}
          # manual workflow_dispatch input (empty on dispatch/scheduled runs)
          MANUAL_ISSUE:   ${{ github.event.inputs.jira_id }}
        run: |
          ISSUE_KEY="${DISPATCH_ISSUE:-$MANUAL_ISSUE}"
          EVENT="${DISPATCH_EVENT:-manual}"

          if [ -n "$ISSUE_KEY" ]; then
            TRIGGER="Start your run. Event: $EVENT | Issue: $ISSUE_KEY. Act on this card only — read its current status and comment markers and continue from the correct point (plan, implement, or address PR comments). Skip the full board scan."
          else
            TRIGGER="Start your run. Process all Ready for Dev cards now."
          fi

          echo "trigger<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TRIGGER"     >> "$GITHUB_OUTPUT"
          echo "EOF"          >> "$GITHUB_OUTPUT"
          echo "Resolved trigger: $TRIGGER"

      - name: Start Bahmni Bot Session
        env:
          TRIGGER_TEXT:    ${{ steps.msg.outputs.trigger }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_TOKEN: ${{ secrets.ATLASSIAN_TOKEN }}
        run: |
          # Step 1: Create the session
          SESSION=$(curl -s -X POST https://api.anthropic.com/v1/sessions \
            -H "x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: managed-agents-2026-04-01" \
            -H "content-type: application/json" \
            -d '{
              "agent": "${{ secrets.BAHMNI_AGENT_ID }}",
              "environment_id": "${{ secrets.BAHMNI_ENV_ID }}",
              "vault_ids": ["${{ secrets.BAHMNI_VAULT_ID }}"],
              "authorization_tokens": [
                { "host": "github.com", "token": "'"${{ secrets.GH_PUSH_TOKEN }}"'" }],
              "title": "Bot run '"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
            }')

          echo "Session response: $SESSION"

          # Step 2: Extract session ID
          SESSION_ID=$(echo "$SESSION" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Session ID: $SESSION_ID"

          # Step 3: Build the full message text (trigger + Atlassian creds)
          FULL_MSG="${TRIGGER_TEXT}

          Atlassian credentials:
          - Domain: https://bahmni.atlassian.net
          - Email: ${ATLASSIAN_EMAIL}
          - API Token: ${ATLASSIAN_TOKEN}"

          # Step 4: Build JSON body safely with jq (handles quoting/newlines)
          BODY=$(jq -n --arg text "$FULL_MSG" '{
            events: [{
              type: "user.message",
              content: [{ type: "text", text: $text }]
            }]
          }')

          # Step 5: Send trigger message
          curl -s -X POST https://api.anthropic.com/v1/sessions/$SESSION_ID/events \
            -H "x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: managed-agents-2026-04-01" \
            -H "content-type: application/json" \
            -d "$BODY"

          echo "Trigger message sent. Agent is now running."
